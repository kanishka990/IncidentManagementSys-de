name: Full CI/CD Pipeline (DEV → UAT → PROD)

# --------------------------------------------------
# STEP 1: Trigger
# --------------------------------------------------
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# --------------------------------------------------
# STEP 2: Permissions & Concurrency
# --------------------------------------------------
permissions:
  contents: write

concurrency:
  group: full-cicd-pipeline
  cancel-in-progress: true

jobs:

# --------------------------------------------------
# STEP 3: Build & Test (DEV)
# --------------------------------------------------
  build-test:
    name: Build & Test DEV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DEV code
        uses: actions/checkout@v4

      - name: Run Tests
        run: echo "✅ DEV testing successful"

# --------------------------------------------------
# STEP 4: Notify QA (DEV)
# --------------------------------------------------
  notify-qa-dev:
    name: Notify QA (DEV)
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Send Email to QA
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔍 DEV Ready for Testing"
          body: |
            Hello QA,

            DEV build is ready.

            ✔ Test the application
            ✔ Approve if no bugs found

            Repository: ${{ github.repository }}
          to: aws.studen@gmail.com
          from: avantikagautam022@gmail.com

# --------------------------------------------------
# STEP 5: QA Approval (DEV)
# --------------------------------------------------
  qa-approval-dev:
    name: QA Approval (DEV)
    needs: notify-qa-dev
    runs-on: ubuntu-latest

    environment:
      name: dev-approval

    steps:
      - name: Waiting for QA Approval (DEV)
        run: echo "⏳ Waiting for QA approval (DEV)..."

# --------------------------------------------------
# STEP 6: Promote DEV → UAT
# --------------------------------------------------
  promote-to-uat:
    name: Promote DEV → UAT
    needs: qa-approval-dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge dev → uat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin
          git checkout uat || git checkout -b uat
          git merge origin/dev --no-edit
          git push origin uat

# --------------------------------------------------
# STEP 7: Notify QA (UAT)
# --------------------------------------------------
  notify-qa-uat:
    name: Notify QA (UAT)
    needs: promote-to-uat
    runs-on: ubuntu-latest

    steps:
      - name: Send Email to QA
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔍 UAT Ready for Testing"
          body: |
            Hello QA,

            UAT build is ready.

            ✔ Test carefully
            ✔ Approve if everything is correct

            Repository: ${{ github.repository }}
          to: aws.studen@gmail.com
          from: avantikagautam022@gmail.com

# --------------------------------------------------
# STEP 8: QA Approval (UAT)
# --------------------------------------------------
  qa-approval-uat:
    name: QA Approval (UAT)
    needs: notify-qa-uat
    runs-on: ubuntu-latest

    environment:
      name: uat-approval

    steps:
      - name: Waiting for QA Approval (UAT)
        run: echo "⏳ Waiting for QA approval (UAT)..."

# --------------------------------------------------
# STEP 9: Promote UAT → PROD
# --------------------------------------------------
  promote-to-prod:
    name: Promote UAT → PROD
    needs: qa-approval-uat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge uat → production
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin
          git checkout production || git checkout -b production
          git merge origin/uat --no-edit
          git push origin production

# --------------------------------------------------
# STEP 10: Notify Deployment Success
# --------------------------------------------------
  notify-success:
    name: Notify Deployment Success
    needs: promote-to-prod
    runs-on: ubuntu-latest

    steps:
      - name: Email DevOps Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Production Deployment Success"
          body: |
            Application successfully deployed to PRODUCTION.

            ✔ QA verified at all stages
            ✔ No bugs found

            Repository: ${{ github.repository }}
          to: avantikagautam022@gmail.com
          from: avantikagautam022@gmail.com
