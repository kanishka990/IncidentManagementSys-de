name: Full CI/CD Pipeline (DEV → UAT → PROD)

# --------------------------------------------------
# STEP 1: Trigger
# --------------------------------------------------
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# --------------------------------------------------
# STEP 2: Permissions & Concurrency
# --------------------------------------------------
permissions:
  contents: write

concurrency:
  group: full-cicd-flow
  cancel-in-progress: true

jobs:

# ==================================================
# 🔷 DEV STAGE
# ==================================================
  dev-build:
    name: DEV Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DEV Code
        uses: actions/checkout@v4

      - name: Build / Test DEV
        run: echo "✅ DEV build successful"

  dev-qa:
    name: DEV QA Notification
    needs: dev-build
    runs-on: ubuntu-latest

    steps:
      - name: Send Email to QA (DEV)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔍 DEV Ready for Testing"
          body: |
            DEV build is ready.

            ✔ Please test
            ✔ Approve if no bugs found

            Repo: ${{ github.repository }}
          to: aws.studen@gmail.com
          from: avantikagautam022@gmail.com

  dev-approval:
    name: DEV Approval
    needs: dev-qa
    runs-on: ubuntu-latest

    environment:
      name: dev-approval

    steps:
      - name: Waiting for DEV QA Approval
        run: echo "⏳ Waiting for DEV QA approval..."

# ==================================================
# 🔷 UAT STAGE
# ==================================================
  promote-to-uat:
    name: Promote DEV → UAT
    needs: dev-approval
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge dev → uat
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin
          git checkout uat || git checkout -b uat
          git merge origin/dev --no-edit
          git push origin uat

  uat-build:
    name: UAT Build
    needs: promote-to-uat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UAT Code
        uses: actions/checkout@v4
        with:
          ref: uat

      - name: Build / Test UAT
        run: echo "✅ UAT build successful"

  uat-qa:
    name: UAT QA Notification
    needs: uat-build
    runs-on: ubuntu-latest

    steps:
      - name: Send Email to QA (UAT)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔍 UAT Ready for Testing"
          body: |
            UAT build is ready.

            ✔ Please test again
            ✔ Approve if everything is correct

            Repo: ${{ github.repository }}
          to: aws.studen@gmail.com
          from: avantikagautam022@gmail.com

  uat-approval:
    name: UAT Approval
    needs: uat-qa
    runs-on: ubuntu-latest

    environment:
      name: uat-approval

    steps:
      - name: Waiting for UAT QA Approval
        run: echo "⏳ Waiting for UAT QA approval..."

# ==================================================
# 🔷 PRODUCTION STAGE
# ==================================================
  prod-deploy:
    name: Production Deployment
    needs: uat-approval
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge uat → production
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin
          git checkout production || git checkout -b production
          git merge origin/uat --no-edit
          git push origin production

      - name: Notify Deployment Success
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Production Deployment Success"
          body: |
            Application deployed successfully to PRODUCTION.

            ✔ DEV + UAT QA passed
            ✔ No bugs found
