name: Full CI/CD Pipeline (DEV → UAT → PROD)

# --------------------------------------------------
# STEP 1: Trigger
# --------------------------------------------------
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# --------------------------------------------------
# STEP 2: Permissions & Concurrency
# --------------------------------------------------
permissions:
  contents: write

concurrency:
  group: full-cicd-pipeline
  cancel-in-progress: true

jobs:

# ==================================================
# 🔷 DEV STAGE (ZIG-ZAG)
# ==================================================

  dev-build:
    name: DEV Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV code
        uses: actions/checkout@v4
      - name: Run Tests
        run: echo "✅ DEV testing successful"

  dev-qa:
    name: DEV QA Notification
    runs-on: ubuntu-latest
    steps:
      - name: Send Email to QA (DEV)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔍 DEV Ready for Testing"
          body: |
            Hello QA,
            DEV build is ready.
            ✔ Test the application
            ✔ Approve if no bugs found
            Repository: ${{ github.repository }}
          to: aws.studen@gmail.com
          from: avantikagautam022@gmail.com

  dev-approval:
    name: QA Approval (DEV)
    needs: [dev-build, dev-qa]
    runs-on: ubuntu-latest
    environment:
      name: dev-approval
    steps:
      - run: echo "✅ DEV approved"

# ==================================================
# 🔷 UAT STAGE (ZIG-ZAG)
# ==================================================

  promote-to-uat:
    name: Promote DEV → UAT
    needs: dev-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin
          git checkout uat || git checkout -b uat
          git merge origin/dev --no-edit
          git push origin uat

  uat-build:
    name: UAT Build & Test
    needs: promote-to-uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uat
      - run: echo "✅ UAT testing successful"

  uat-qa:
    name: UAT QA Notification
    needs: promote-to-uat
    runs-on: ubuntu-latest
    steps:
      - name: Send Email to QA (UAT)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🔍 UAT Ready for Testing"
          body: |
            Hello QA,
            UAT build is ready.
            ✔ Test carefully
            ✔ Approve if everything is correct
            Repository: ${{ github.repository }}
          to: aws.studen@gmail.com
          from: avantikagautam022@gmail.com

  uat-approval:
    name: QA Approval (UAT)
    needs: [uat-build, uat-qa]
    runs-on: ubuntu-latest
    environment:
      name: uat-approval
    steps:
      - run: echo "✅ UAT approved"

# ==================================================
# 🔷 PRODUCTION STAGE
# ==================================================

  promote-to-prod:
    name: Promote UAT → PROD
    needs: uat-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin
          git checkout production || git checkout -b production
          git merge origin/uat --no-edit
          git push origin production

  notify-success:
    name: Notify Deployment Success
    needs: promote-to-prod
    runs-on: ubuntu-latest
    steps:
      - name: Email DevOps Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Production Deployment Success"
          body: |
            Application successfully deployed to PRODUCTION.
            ✔ QA verified at all stages
            ✔ No bugs found
            Repository: ${{ github.repository }}
          to: avantikagautam022@gmail.com
          from: avantikagautam022@gmail.com
