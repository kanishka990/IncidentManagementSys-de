name: Local Deploy Test Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: docker build -t incident-backend ./backend

      - name: Build Frontend Image
        run: docker build -t incident-frontend ./frontend

      - name: Run Backend Container
        run: |
          docker run -d -p 5000:5000 --name backend-test incident-backend
          sleep 10
          docker ps

      - name: Run Frontend Container
        run: |
          docker run -d -p 3000:3000 --name frontend-test incident-frontend
          sleep 10
          docker ps

      - name: Stop and Remove Containers
        run: |
          docker stop backend-test
          docker stop frontend-test
          docker rm backend-test
          docker rm frontend-test
