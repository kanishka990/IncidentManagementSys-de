name: Deploy Full Stack App

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # BACKEND IMAGE
      - name: Build Backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/incident-backend ./backend

      - name: Push Backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/incident-backend

      # FRONTEND IMAGE
      - name: Build Frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/incident-frontend ./frontend

      - name: Push Frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/incident-frontend
